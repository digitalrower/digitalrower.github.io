<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0F172A"/>
  <rect x="0" y="0" width="1600" height="9" fill="#A78BFA"/>

  <text x="80" y="78" fill="#E2E8F0" font-size="42" font-weight="bold">What reaches a sub-agent</text>
  <text x="80" y="120" fill="#94A3B8" font-size="22">Three inputs cross the context boundary. You wrote two of them.</text>

  <!-- boundary -->
  <line x1="706" y1="155" x2="706" y2="640" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="706" y="146" fill="#64748B" font-size="15" letter-spacing="2" text-anchor="middle">CONTEXT BOUNDARY</text>

  <!-- source card 1 -->
  <rect x="90" y="195" width="480" height="88" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="116" y="235" fill="#E2E8F0" font-size="24" font-weight="bold">Agent definition body</text>
  <text x="116" y="264" fill="#94A3B8" font-size="17">the system prompt you wrote</text>
  <line x1="574" y1="239" x2="842" y2="239" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- source card 2 -->
  <rect x="90" y="303" width="480" height="88" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="116" y="343" fill="#E2E8F0" font-size="24" font-weight="bold">Project instruction file</text>
  <text x="116" y="372" fill="#94A3B8" font-size="17">repo rules, loaded automatically</text>
  <line x1="574" y1="347" x2="842" y2="347" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- source card 3, the invisible one -->
  <rect x="90" y="411" width="480" height="88" rx="10" fill="#1E293B" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="116" y="451" fill="#A78BFA" font-size="24" font-weight="bold">Task prompt</text>
  <text x="116" y="480" fill="#A78BFA" font-size="17">written by the model, never shown to you</text>
  <line x1="574" y1="455" x2="842" y2="455" stroke="#A78BFA" stroke-width="3" marker-end="url(#arrowViolet)"/>

  <!-- source card 4, blocked -->
  <rect x="90" y="545" width="480" height="88" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="116" y="585" fill="#64748B" font-size="24" font-weight="bold">Your conversation</text>
  <text x="116" y="614" fill="#64748B" font-size="17">everything said before the delegation</text>
  <line x1="574" y1="589" x2="672" y2="589" stroke="#475569" stroke-width="2.5"/>
  <line x1="690" y1="573" x2="722" y2="605" stroke="#64748B" stroke-width="4"/>
  <line x1="722" y1="573" x2="690" y2="605" stroke="#64748B" stroke-width="4"/>
  <text x="760" y="595" fill="#64748B" font-size="19">does not cross</text>

  <!-- sub-agent box -->
  <rect x="850" y="185" width="660" height="390" rx="14" fill="#1E293B" stroke="#475569" stroke-width="2.5"/>
  <text x="1180" y="240" fill="#94A3B8" font-size="20" letter-spacing="2" text-anchor="middle">SUB-AGENT CONTEXT WINDOW</text>
  <line x1="900" y1="266" x2="1460" y2="266" stroke="#334155" stroke-width="2"/>
  <text x="1180" y="330" fill="#E2E8F0" font-size="30" text-anchor="middle">Starts empty.</text>
  <text x="1180" y="390" fill="#E2E8F0" font-size="30" text-anchor="middle">Receives three inputs.</text>
  <text x="1180" y="462" fill="#A78BFA" font-size="30" font-weight="bold" text-anchor="middle">You can see two of them.</text>
  <text x="1180" y="524" fill="#64748B" font-size="19" text-anchor="middle">Its own tools. Its own reasoning. None of it returns.</text>

  <!-- return path -->
  <text x="770" y="682" fill="#94A3B8" font-size="21" text-anchor="middle">Only the finished report comes back: 21k tokens into the main context</text>
  <path d="M 1180 575 L 1180 706 L 352 706" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowReturn)"/>

  <!-- footer -->
  <line x1="80" y1="768" x2="1520" y2="768" stroke="#1E293B" stroke-width="2"/>
  <text x="80" y="812" fill="#94A3B8" font-size="19">The agent definition costs 67 tokens in the main window. Appending a whole section to its body did not change that number,</text>
  <text x="80" y="842" fill="#94A3B8" font-size="19">because only the description is loaded for routing. The body goes to the sub-agent and never to you.</text>
  <text x="1520" y="878" fill="#475569" font-size="17" text-anchor="end">jackmonte.com</text>
</svg>
