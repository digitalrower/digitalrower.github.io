<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="440" fill="#0F172A"/>
  <rect x="0" y="0" width="1000" height="5" fill="#FBBF24"/>

  <text x="40" y="48" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">Before: the hand-rolled runner owns everything</text>

  <!-- dataset -->
  <rect x="40" y="190" width="150" height="56" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="115" y="216" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">evals/</text>
  <text x="115" y="234" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">dataset.json</text>

  <!-- runner (center) -->
  <rect x="320" y="170" width="190" height="96" rx="8" fill="#334155" stroke="#FBBF24" stroke-width="2"/>
  <text x="415" y="205" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">run_eval loop</text>
  <text x="415" y="227" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#CBD5E1" text-anchor="middle">(runner.py)</text>
  <text x="415" y="248" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">you own the loop</text>

  <!-- pipeline -->
  <rect x="640" y="60" width="180" height="56" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="730" y="86" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">query.main</text>
  <text x="730" y="104" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">(RAG pipeline)</text>

  <!-- judges -->
  <rect x="640" y="135" width="180" height="56" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="730" y="161" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">3 judges</text>
  <text x="730" y="179" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">(scorer.py)</text>

  <!-- manual score attach -->
  <rect x="640" y="210" width="180" height="56" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="730" y="236" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">create_score x3</text>
  <text x="730" y="254" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">(manual attach)</text>

  <!-- result files -->
  <rect x="640" y="300" width="180" height="50" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="730" y="330" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">results + summary.json</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>
  <line x1="190" y1="218" x2="318" y2="218" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow1)"/>
  <line x1="510" y1="195" x2="638" y2="100" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow1)"/>
  <line x1="510" y1="210" x2="638" y2="165" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow1)"/>
  <line x1="510" y1="232" x2="638" y2="235" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow1)"/>
  <line x1="510" y1="250" x2="638" y2="320" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow1)"/>

  <text x="40" y="400" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#94A3B8">Comparing two runs means diffing two summary.json files by eye.</text>
</svg>
