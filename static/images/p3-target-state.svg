<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="500" fill="#0F172A"/>
  <rect x="0" y="0" width="1000" height="5" fill="#FBBF24"/>

  <text x="40" y="48" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">After: canonical path untouched, managed path added alongside</text>

  <!-- canonical path container -->
  <rect x="560" y="70" width="410" height="120" rx="10" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="580" y="95" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#34D399">CANONICAL PATH (UNCHANGED)</text>

  <rect x="580" y="110" width="170" height="60" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="665" y="136" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">run_eval</text>
  <text x="665" y="155" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="middle">(runner.py)</text>

  <rect x="780" y="110" width="170" height="60" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="865" y="136" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">results.json +</text>
  <text x="865" y="155" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">summary.json</text>

  <!-- additive path container -->
  <rect x="300" y="320" width="670" height="120" rx="10" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="345" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#FBBF24">NEW ADDITIVE PATH</text>

  <rect x="320" y="360" width="150" height="60" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="385" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">seed script</text>
  <text x="395" y="403" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">(one time)</text>

  <rect x="510" y="360" width="170" height="60" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="595" y="385" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Langfuse Dataset</text>
  <text x="595" y="403" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">'rag-starter-eval'</text>

  <rect x="720" y="360" width="230" height="60" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="835" y="385" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">experiment.py</text>
  <text x="835" y="403" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">run_experiment + UI</text>

  <!-- shared resources (center) -->
  <rect x="40" y="220" width="190" height="56" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="135" y="246" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">evals/dataset.json</text>
  <text x="135" y="264" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">+ query.main + judges</text>
  <text x="135" y="300" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">shared by both paths</text>

  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#FBBF24"/>
    </marker>
  </defs>

  <!-- shared feeds canonical -->
  <line x1="230" y1="235" x2="578" y2="140" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <!-- shared feeds additive -->
  <line x1="230" y1="262" x2="318" y2="380" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <!-- canonical internal -->
  <line x1="750" y1="140" x2="778" y2="140" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <!-- additive internal -->
  <line x1="470" y1="390" x2="508" y2="390" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <text x="489" y="378" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#FBBF24" text-anchor="middle">seed</text>
  <line x1="680" y1="390" x2="718" y2="390" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <text x="40" y="470" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#94A3B8">Two paths share the dataset, the pipeline, and the judges. They do not share runner code.</text>
</svg>
